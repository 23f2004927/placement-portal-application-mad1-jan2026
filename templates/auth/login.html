{% extends "base.html" %} {% block title %}Login — Placement Portal{% endblock
%} {% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-5">
        <h3 class="mb-4">Login</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('auth.login') }}">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                />
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>

        <hr />
        <p class="text-center mb-0">
            Student?
            <a href="{{ url_for('student_reg.registerStudent') }}"
                >Register here</a
            >
            · Company?
            <a href="{{ url_for('company_reg.registerCompany') }}"
                >Register here</a
            >
        </p>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block pageTitle %}Company Registration{% endblock %}
{% block breadcrumb %}AUTH / REGISTER COMPANY{% endblock %}

{% block mainContent %}
<div class="d-flex justify-content-center align-items-center py-5">
    <div class="brutal-card w-100" style="max-width: 800px">
        <div class="d-flex justify-content-between align-items-center border-bottom border-dark border-2 pb-3 mb-4">
            <h2 class="font-display fs-2 mb-0">COMPANY PARTNER</h2>
            <span class="data-tag"
                style="background-color: var(--color-secondary); color: var(--color-border);">PENDING_VERIFICATION</span>
        </div>

        <form method="POST" action="{{ url_for('company_reg.registerCompany') }}">
            {{ form.hidden_tag() if form else '' }}
            <div class="row g-4 font-mono">
                <div class="col-md-6">
                    <label class="form-label fw-bold">USERNAME *</label>
                    <input type="text" class="form-control" name="username" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">EMAIL ADDRESS *</label>
                    <input type="email" class="form-control" name="email" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">PASSWORD *</label>
                    <input type="password" class="form-control" name="password" required minlength="8" />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">COMPANY NAME *</label>
                    <input type="text" class="form-control" name="company_name" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">HR CONTACT</label>
                    <input type="text" class="form-control" name="hr_contact" />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">WEBSITE URL</label>
                    <input type="url" class="form-control" name="website" placeholder="https://" />
                </div>
                <div class="col-12">
                    <label class="form-label fw-bold">COMPANY DESCRIPTION</label>
                    <textarea class="form-control" name="description" rows="3"></textarea>
                </div>
            </div>
            <button type="submit" class="brutal-btn secondary w-100 py-3 mt-5">
                SUBMIT FOR APPROVAL
            </button>
        </form>
    </div>
</div>
{% endblock %}

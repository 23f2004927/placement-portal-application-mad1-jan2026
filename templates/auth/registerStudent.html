{% extends "base.html" %} {% block title %}Student Registration — Placement
Portal{% endblock %} {% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-6">
        <h3 class="mb-4">Student Registration</h3>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form
            method="POST"
            action="{{ url_for('student_reg.registerStudent') }}"
        >
            <h6 class="text-muted mb-3">Account Details</h6>
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    class="form-control"
                    id="username"
                    name="username"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                    type="email"
                    class="form-control"
                    id="email"
                    name="email"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    class="form-control"
                    id="password"
                    name="password"
                    required
                />
            </div>

            <hr />
            <h6 class="text-muted mb-3">Student Details</h6>
            <div class="mb-3">
                <label for="full_name" class="form-label">Full Name</label>
                <input
                    type="text"
                    class="form-control"
                    id="full_name"
                    name="full_name"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="department" class="form-label">Department</label>
                <input
                    type="text"
                    class="form-control"
                    id="department"
                    name="department"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="graduation_year" class="form-label"
                    >Graduation Year</label
                >
                <input
                    type="number"
                    class="form-control"
                    id="graduation_year"
                    name="graduation_year"
                    min="2024"
                    max="2035"
                    required
                />
            </div>
            <div class="mb-3">
                <label for="cgpa" class="form-label"
                    >CGPA <span class="text-muted">(optional)</span></label
                >
                <input
                    type="number"
                    class="form-control"
                    id="cgpa"
                    name="cgpa"
                    min="0"
                    max="10"
                    step="0.01"
                />
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Register
            </button>
        </form>

        <hr />
        <p class="text-center mb-0">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Login</a>
        </p>
    </div>
</div>
{% endblock %}

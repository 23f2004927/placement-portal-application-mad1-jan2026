{% extends "base.html" %}

{% block pageTitle %}Student Registration{% endblock %}
{% block breadcrumb %}AUTH / REGISTER STUDENT{% endblock %}

{% block mainContent %}
<div class="d-flex justify-content-center align-items-center py-5">
    <div class="brutal-card w-100" style="max-width: 800px">
        <div class="d-flex justify-content-between align-items-center border-bottom border-dark border-2 pb-3 mb-4">
            <h2 class="font-display fs-2 mb-0">STUDENT ONBOARDING</h2>
            <span class="data-tag">SYSTEM_INIT_01</span>
        </div>

        <form method="POST" action="{{ url_for('student_reg.registerStudent') }}" id="registerStudentForm">
            {{ form.hidden_tag() if form else '' }}

            <div class="row g-4">
                <div class="col-md-6">
                    <label class="form-label font-mono fw-bold">USERNAME *</label>
                    <input type="text" class="form-control" name="userName" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label font-mono fw-bold">EMAIL ADDRESS *</label>
                    <input type="email" class="form-control" name="email" required />
                </div>
                <div class="col-md-6">
                    <label class="form-label font-mono fw-bold">PASSWORD *</label>
                    <input type="password" class="form-control" name="password" required minlength="8" />
                </div>
                <div class="col-md-6">
                    <label class="form-label font-mono fw-bold">FULL NAME *</label>
                    <input type="text" class="form-control" name="fullName" required />
                </div>
                <div class="col-md-4">
                    <label class="form-label font-mono fw-bold">DEPARTMENT *</label>
                    <input type="text" class="form-control" name="department" required />
                </div>
                <div class="col-md-4">
                    <label class="form-label font-mono fw-bold">GRAD YEAR *</label>
                    <input type="number" class="form-control" name="graduationYear" required min="2020" max="2030" />
                </div>
                <div class="col-md-4">
                    <label class="form-label font-mono fw-bold">CGPA</label>
                    <input type="number" step="0.01" class="form-control" name="cgpa" min="0" max="10" />
                </div>
            </div>
            <button type="submit" class="brutal-btn w-100 py-3 mt-5">
                INITIALIZE ACCOUNT
            </button>
        </form>
    </div>
</div>
{% endblock %}

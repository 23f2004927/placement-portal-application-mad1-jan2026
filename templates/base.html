<!doctype html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block pageTitle %}Placement Portal{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="{{ url_for('static', filename='css/custom.css') }}" rel="stylesheet" />
</head>

<body>
    <div class="app-wrapper" id="mainAppWrapper">
        {% include 'components/_sidebar.html' %}

        <main class="main-content d-flex flex-column" id="mainContentArea">
            <header class="border-bottom border-dark border-2 bg-white p-3 px-4">
                <div class="font-mono fw-bold text-uppercase">
                    {% block breadcrumb %}DASHBOARD{% endblock %}
                </div>
            </header>

            <div class="content-container flex-grow-1" id="pageContent">
                {% include 'components/_flash.html' %}
                {% block mainContent %}{% endblock %}
            </div>
        </main>
    </div>

    {% include 'components/_confirmModal.html' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

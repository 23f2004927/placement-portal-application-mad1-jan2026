{% extends "base.html" %}
{% block pageTitle %}Company Profile - Console{% endblock %}
{% block breadcrumb %}COMPANY / SETTINGS / PROFILE{% endblock %}

{% block mainContent %}

<div class="d-flex justify-content-center align-items-center  pb-3 mb-4">
    <h1 class="font-display display-5 mb-0">COMPANY PROFILE</h1>
</div>
<div class="row g-4 justify-content-center">
    <div class="col-lg-8">
        <div class="brutal-card p-5" id="companyProfileCard">
            <form action="{{ url_for('company.profile') }}" method="POST" id="companyProfileForm">
                {{ form.hidden_tag() if form else '' }}

                <h4 class="font-display border-bottom border-dark border-2 pb-2 mb-4">
                    GENERAL INFO
                </h4>
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">COMPANY NAME *</label>
                        <input type="text" class="form-control" name="company_name" value="{{ company.company_name }}"
                            required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">INDUSTRY SECTOR</label>
                        <input type="text" class="form-control" name="industry"
                            value="{{ company.industry | default('') }}" placeholder="e.g. Fintech" />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">HR CONTACT *</label>
                        <input type="text" class="form-control" name="hr_contact"
                            value="{{ company.hr_contact | default('') }}" required />
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">WEBSITE URL</label>
                        <input type="url" class="form-control" name="website"
                            value="{{ company.website | default('') }}" placeholder="https://" />
                    </div>
                </div>

                <h4 class="font-display border-bottom border-dark border-2 pb-2 mb-4 mt-5">
                    BRANDING
                </h4>
                <div class="row g-4 mb-4">
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">COMPANY BIO</label>
                        <textarea class="form-control" name="description" rows="2"
                            placeholder="Describe your company, work culture, and what you build...">{{ company.description | default('') }}</textarea>
                    </div>
                    <div class="col-md-6 d-flex align-items-end justify-content-end">
                        <button type="submit" class="brutal-btn secondary px-5 py-2 fs-5" id="saveProfileBtn">
                            SAVE IDENTITY
                        </button>
                    </div>
                </div>


            </form>
        </div>
    </div>


</div>
{% endblock %}

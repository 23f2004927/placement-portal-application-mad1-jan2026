{% extends "base.html" %} {% block pageTitle %}Initiate Drive - Company Console{%
endblock %} {% block mainContent %}
<div class="d-flex justify-content-between align-items-center border-bottom border-dark border-2 pb-3 mb-4">
    <h1 class="font-display display-5 mb-0">INITIATE PLACEMENT DRIVE</h1>
    <a href="{{ url_for('company.dashboard') }}" class="btn btn-neo wireframe py-2 px-4">&larr; BACK TO CONSOLE</a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="neo-card p-5">
            <div class="mb-4 pb-3 border-bottom border-dark border-2">
                <span class="data-tag border-0 text-dark mb-2 d-inline-block"
                    style="background-color: var(--color-secondary)">NEW LISTING</span>
                <p class="font-mono text-muted mb-0">
                    Note: All new drives require Administrator approval before
                    becoming visible to students.
                </p>
            </div>

            <form action="#" method="POST">
                <div class="mb-4">
                    <label class="form-label font-mono fw-bold">JOB TITLE / ROLE *</label>
                    <input type="text" class="form-control form-control-lg font-display text-uppercase" name="job_title"
                        required placeholder="e.g. Frontend Engineer" />
                </div>

                <div class="mb-4">
                    <label class="form-label font-mono fw-bold">APPLICATION DEADLINE *</label>
                    <input type="date" class="form-control font-mono" name="application_deadline" required />
                </div>

                <div class="mb-4">
                    <label class="form-label font-mono fw-bold">ELIGIBILITY CRITERIA *</label>
                    <input type="text" class="form-control" name="eligibility_criteria" required
                        placeholder="e.g. Minimum 7.5 CGPA, CS/IT only" />
                </div>

                <div class="mb-5">
                    <label class="form-label font-mono fw-bold">FULL JOB DESCRIPTION *</label>
                    <textarea class="form-control" name="job_description" rows="6" required
                        placeholder="Outline responsibilities, tech stack, and expectations..."></textarea>
                </div>

                <button type="submit" class="btn btn-neo secondary w-100 fs-4 py-3 text-dark">
                    SUBMIT FOR ADMIN APPROVAL &rarr;
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

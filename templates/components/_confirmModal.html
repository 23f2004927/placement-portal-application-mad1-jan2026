<div class="modal fade" id="globalConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-0 border border-dark" style="border-width: 1px !important;">

            <div class="modal-header border-bottom p-4">
                <h4 class="modal-title font-display fs-5 mb-0" id="modalTitle">Confirm Action</h4>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body font-body p-4 text-muted">
                Are you sure you want to proceed? This action may be irreversible once executed.
            </div>

            <div class="modal-footer border-top bg-light p-3 d-flex justify-content-between">
                <button type="button" class="btn btn-outline-dark rounded-0 font-mono fw-bold shadow-none px-4 py-2"
                    data-bs-dismiss="modal">CANCEL</button>
                <form id="confirmModalForm" method="POST" action="" class="m-0">
                    {{ form.hidden_tag() if form else '' }}
                    <button type="submit" class="btn btn-danger rounded-0 font-mono fw-bold shadow-none px-4 py-2"
                        id="confirmSubmitBtn">
                        EXECUTE
                    </button>
                </form>
            </div>

        </div>
    </div>
</div>

<script>
    document.getElementById('globalConfirmModal')
        .addEventListener('show.bs.modal', (e) => {
            const form = document.getElementById('confirmModalForm');
            form.action = e.relatedTarget.dataset.actionUrl;

            let input = form.querySelector('input[name="action"]');
            if (!input) {
                input = document.createElement('input');
                input.type = 'hidden';
                input.name = 'action';
                form.appendChild(input);
            }
            input.value = e.relatedTarget.dataset.actionValue;
        });
</script>

<div class="brutal-card p-2 mb-4" id="globalSearchBar">
    <form action="{{ url_for(request.endpoint) }}" method="GET" class="d-flex align-items-center gap-3 m-0">
        {{ form.hidden_tag() if form else '' }}
        <div class="input-group">

            <input type="text" name="searchQuery" class="form-control" placeholder="SEARCH DIRECTORY..."
                value="{{ request.args.get('searchQuery', '') }}" />
        </div>
        <button type="submit" class="brutal-btn p-1 d-flex align-items-center gap-1" id="searchSubmitBtn">
            <span class="input-group-text bg-white border-dark border-2 p-1 py-0 rounded-0 font-mono fw-bold">
                <i class="bi bi-search"></i>
            </span>SEARCH
        </button>
    </form>

    {% if filterChips %}
    <div class="mt-3 d-flex flex-wrap gap-2 align-items-center" id="filterChipsContainer">
        <span class="font-mono text-muted fw-bold me-2" style="font-size: 0.85rem">ACTIVE FILTERS:</span>
        {% for chip in filterChips %}
        <span class="data-tag border-dark bg-white rounded-pill px-3">{{ chip }}</span>
        {% endfor %}
    </div>
    {% endif %}
</div>

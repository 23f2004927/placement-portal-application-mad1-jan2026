<div class="bg-white border border-dark p-0 mb-4" id="globalSearchBar" style="border-width: 1px !important;">
    <form action="{{ url_for(request.endpoint) }}" method="GET" class="d-flex align-items-stretch m-0">
        {{ form.hidden_tag() if form else '' }}

        <div class="flex-grow-1 d-flex align-items-center px-3 border-end">
            <i class="bi bi-search me-2 text-muted"></i>
            <input type="text" name="searchQuery" class="form-control border-0 shadow-none font-mono py-3"
                placeholder="Search directory..." value="{{ request.args.get('searchQuery', '') }}" />
        </div>

        {% if filter_items %}
        {{ filter_items }}
        {% endif %}

        <button type="submit" class="btn btn-dark rounded-0 px-4 border-0 font-mono fw-bold shadow-none">
            SEARCH
        </button>
    </form>

    {% if filterChips %}
    <div class="p-2 border-top d-flex flex-wrap gap-2 align-items-center bg-light">
        <span class="font-mono text-muted small ms-2 fw-bold">Active Filters:</span>
        {% for chip in filterChips %}
        <span class="badge bg-secondary rounded-0 px-2 py-1 font-mono fw-normal">{{ chip }}</span>
        {% endfor %}
    </div>
    {% endif %}
</div>

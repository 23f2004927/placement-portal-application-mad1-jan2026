<div class="brutal-card p-0 mb-4" id="globalSearchBar">
    <form action="{{ url_for(request.endpoint) }}" method="GET" class="d-flex align-items-stretch m-0">
        {{ form.hidden_tag() if form else '' }}

        <div class="flex-grow-1 d-flex align-items-center px-3 border-end border-dark border-2">
            <i class="bi bi-search me-2"></i>
            <input type="text" name="searchQuery" class="form-control border-0 shadow-none font-mono py-3"
                placeholder="SEARCH DIRECTORY..." value="{{ request.args.get('searchQuery', '') }}" />
        </div>

        {% if filter_items %}
        {{ filter_items }}
        {% endif %}

        <button type="submit" class="brutal-btn secondary px-4 border-0 border-start border-dark border-2">
            GO
        </button>
    </form>

    {% if filterChips %}
    <div class="p-2 border-top border-dark border-2 d-flex flex-wrap gap-2 align-items-center bg-light">
        <span class="font-mono text-muted fw-bold ms-2" style="font-size: 0.75rem">ACTIVE:</span>
        {% for chip in filterChips %}
        <span class="data-tag border-dark bg-white text-dark px-2" style="font-size: 0.7rem;">{{ chip }}</span>
        {% endfor %}
    </div>
    {% endif %}
</div>

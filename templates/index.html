{% extends "base.html" %} {% block title %}Home — Placement Portal{% endblock %}
{% block content %}
<div
    class="row justify-content-center align-items-center"
    style="min-height: 60vh"
>
    <div class="col-12 text-center">
        {% if role %}
        <h2>Logged in as <span class="badge bg-primary">{{ role }}</span></h2>
        <p class="text-muted mt-2">Dashboard coming soon.</p>
        {% else %}
        <h2>Welcome to the Placement Portal</h2>
        <p class="text-muted mt-2">
            Please <a href="{{ url_for('auth.login') }}">login</a> to continue.
        </p>
        {% endif %}
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block pageTitle %}My Profile - Student Desk{% endblock %}
{% block breadcrumb %}STUDENT / PROFILE{% endblock %}

{% block mainContent %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="font-display display-6 mb-0">STUDENT DOSSIER</h1>
    <span class="data-tag bg-white border-dark">COMPLETION: {{ profileProgress | default('70') }}%</span>
</div>

<div class="w-100 border border-dark border-2 mb-5 bg-white" style="height: 1.5rem;" id="profileProgressBar">
    <div class="h-100"
        style="width: {{ profileProgress | default('70') }}%; background-color: var(--color-primary); border-right: 2px solid #000;">
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-lg-10">
        <form action="{{ url_for('student.profile') }}" method="POST" enctype="multipart/form-data"
            id="studentProfileForm">
            {{ form.hidden_tag() if form else '' }}

            <div class="neo-card p-5 mb-5" id="academicInfoCard">
                <h4 class="font-display border-bottom border-dark border-2 pb-2 mb-4">ACADEMIC METRICS</h4>
                <div class="row g-4">
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">CURRENT CGPA *</label>
                        <input type="number" step="0.01" class="form-control font-mono fs-5" name="cgpa"
                            value="{{ student.cgpa }}" required min="0" max="10">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">ACTIVE BACKLOGS *</label>
                        <input type="number" class="form-control font-mono fs-5" name="activeBacklogs"
                            value="{{ student.activeBacklogs | default('0') }}" required min="0">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">DEPARTMENT *</label>
                        <select class="form-select border-dark border-2 font-mono" name="department" required>
                            <option value="CS" {% if student.department=='CS' %}selected{% endif %}>Computer Science
                            </option>
                            <option value="IT" {% if student.department=='IT' %}selected{% endif %}>Information Tech
                            </option>
                            <option value="ECE" {% if student.department=='ECE' %}selected{% endif %}>Electronics
                            </option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label font-mono fw-bold">GRADUATION YEAR *</label>
                        <input type="number" class="form-control font-mono" name="gradYear"
                            value="{{ student.gradYear }}" required>
                    </div>
                </div>
            </div>

            <div class="neo-card p-5 mb-5" style="background-color:black"></div>
